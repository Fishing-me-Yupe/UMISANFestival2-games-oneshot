      <!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>秋の味覚 一本釣りゲーム</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      background-color: #fceabb;
      font-family: 'Helvetica Neue', Arial, sans-serif;
      text-align: center;
      user-select: none;
      overflow-x: hidden;
    }
    h1 {
      margin: 15px 0 5px;
      color: #8b4513;
      font-size: clamp(20px, 5vw, 32px);
    }
    #game-container {
      position: relative;
      width: 100%;
      max-width: 800px;
      margin: 0 auto;
      display: flex;
      justify-content: center;
    }
    canvas {
      background-color: #fff8dc;
      border: 4px solid #8b4513;
      border-radius: 12px;
      box-shadow: 0 8px 16px rgba(0, 0, 0, 0.2);
      cursor: crosshair;
      max-width: 100%;
      height: auto;
      touch-action: none;
    }
    .ui-panel {
      display: flex;
      justify-content: space-between;
      width: 90%;
      max-width: 800px;
      margin: 10px auto;
      font-size: clamp(14px, 3.5vw, 18px);
      font-weight: bold;
      color: #5c2c0c;
    }
    .btn {
      padding: 10px 20px;
      font-size: 16px;
      font-weight: bold;
      color: #fff;
      background-color: #e67e22;
      border: none;
      border-radius: 20px;
      cursor: pointer;
      box-shadow: 0 4px #d35400;
      transition: all 0.1s;
      margin: 5px;
    }
    .btn:active {
      box-shadow: 0 0 #d35400;
      transform: translateY(4px);
    }
    .btn:disabled {
      background-color: #bdc3c7;
      box-shadow: none;
      cursor: not-allowed;
    }
    .modal-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.7);
      display: flex;
      justify-content: center;
      align-items: center;
      z-index: 100;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.3s ease;
    }
    .modal-overlay.active {
      opacity: 1;
      pointer-events: auto;
    }
    .reward-card-container {
      position: relative;
      background: #fff;
      padding: 20px;
      border-radius: 20px;
      text-align: center;
      max-width: 90%;
      width: 360px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.5);
      overflow: hidden;
    }
    .reward-card-container h2 {
      color: #e67e22;
      margin-top: 0;
      font-size: 24px;
    }
    .card-frame-wrapper {
      position: relative;
      width: 200px;
      height: 200px;
      margin: 15px auto;
      animation: tiltAnimation 2s ease-in-out infinite alternate;
    }
    @keyframes tiltAnimation {
      0% { transform: rotate(-8deg); }
      100% { transform: rotate(8deg); }
    }
    .card-frame {
      width: 100%;
      height: 100%;
      border-radius: 24px;
      padding: 8px;
      background: linear-gradient(135deg, #ff4e50, #f9d423, #ff4e50);
      box-sizing: border-box;
      box-shadow: 0 6px 12px rgba(0,0,0,0.15);
    }
    .card-inner {
      width: 100%;
      height: 100%;
      background: #fff;
      border-radius: 16px;
      display: flex;
      justify-content: center;
      align-items: center;
      overflow: hidden;
    }
    .card-inner img {
      max-width: 85%;
      max-height: 85%;
      object-fit: contain;
    }
    .particle-canvas {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
    }
    .collection-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(90px, 1fr));
      gap: 10px;
      max-height: 300px;
      overflow-y: auto;
      padding: 10px;
    }
    .collection-item {
      background: #fff8dc;
      border: 2px solid #8b4513;
      border-radius: 10px;
      padding: 5px;
      font-size: 11px;
      opacity: 0.4;
    }
    .collection-item.unlocked {
      opacity: 1;
      border-color: #e67e22;
      box-shadow: 0 2px 5px rgba(0,0,0,0.2);
    }
    .collection-item img {
      width: 100%;
      height: 60px;
      object-fit: contain;
    }
  </style>
</head>
<body>

  <h1>🍂 秋の味覚 一本釣りゲーム 🎣</h1>
  
  <div class="ui-panel">
    <div>残り時間: <span id="time">30</span> 秒</div>
    <div>スコア: <span id="score">0</span> pt</div>
    <div>通算: <span id="total-score">0</span> pt</div>
  </div>

  <div id="game-container">
    <canvas id="gameCanvas" width="800" height="500"></canvas>
  </div>

  <div style="margin-top: 10px; margin-bottom: 20px;">
    <button id="start-btn" class="btn">ゲームスタート！</button>
    <button id="collection-btn" class="btn" style="background-color: #8b4513;">ずかん</button>
  </div>

  <div id="reward-modal" class="modal-overlay">
    <div class="reward-card-container">
      <canvas id="particleCanvas" class="particle-canvas"></canvas>
      <h2 id="reward-title">〇〇ゲット‼︎</h2>
      <div class="card-frame-wrapper">
        <div class="card-frame">
          <div class="card-inner">
            <img id="reward-img" src="" alt="Reward">
          </div>
        </div>
      </div>
      <button id="modal-close-btn" class="btn">閉じる</button>
    </div>
  </div>

  <div id="collection-modal" class="modal-overlay">
    <div class="reward-card-container" style="width: 450px;">
      <h2>獲得レシピ一覧</h2>
      <div id="collection-grid" class="collection-grid"></div>
      <button id="collection-close-btn" class="btn" style="margin-top: 15px;">閉じる</button>
    </div>
  </div>

  <script>
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');
    const scoreEl = document.getElementById('score');
    const totalScoreEl = document.getElementById('total-score');
    const timeEl = document.getElementById('time');
    const startBtn = document.getElementById('start-btn');
    const collectionBtn = document.getElementById('collection-btn');
    const rewardModal = document.getElementById('reward-modal');
    const rewardTitle = document.getElementById('reward-title');
    const rewardImg = document.getElementById('reward-img');
    const modalCloseBtn = document.getElementById('modal-close-btn');
    const collectionModal = document.getElementById('collection-modal');
    const collectionGrid = document.getElementById('collection-grid');
    const collectionCloseBtn = document.getElementById('collection-close-btn');

    const BASE_URL = 'https://fishing-me-yupe.github.io/oneshot-assets/';

    const rewardData = [
      { id: 1, req: 6000, name: 'かぼちゃとレンコンの煮物', file: 'pumpkin-and-lotus-stew.svg' },
      { id: 2, req: 12000, name: '炊き込みご飯', file: 'japanese-mixed-rice.svg' },
      { id: 3, req: 18000, name: '焼き秋刀魚', file: 'grilled-pacific-saury.svg' },
      { id: 4, req: 24000, name: 'りんごと梨のパイ', file: 'apple-and-pear-pie.svg' },
      { id: 5, req: 30000, name: '海鮮丼', file: 'seafood-rice-bowl.svg' },
      { id: 6, req: 36000, name: 'パフェ', file: 'parfait.svg' },
      { id: 7, req: 42000, name: '弁当', file: 'lunch-box.svg' }
    ];

    const imageSources = {
      kaki: BASE_URL + 'persimmon.svg',
      satsumaimo: BASE_URL + 'sweetpotato.svg',
      sanma: BASE_URL + 'pacific-saury.svg',
      budou: BASE_URL + 'grapes.svg',
      nashi: BASE_URL + 'pears.svg',
      kabocha: BASE_URL + 'pumpkin.svg',
      kinoko: BASE_URL + 'mushrooms.svg',
      apple: BASE_URL + 'apple.svg',
      marron: BASE_URL + 'marron.svg',
      rice: BASE_URL + 'rice.svg',
      salmon: BASE_URL + 'salmon.svg',
      lotus: BASE_URL + 'lotus-roots.svg',
      arm: BASE_URL + 'arm.svg',
      leaf: BASE_URL + 'leaf.svg'
    };

    rewardData.forEach(r => {
      imageSources['reward_' + r.id] = BASE_URL + r.file;
    });

    const images = {};
    let loadedImageCount = 0;
    const totalImages = Object.keys(imageSources).length;

    const coloredLeafCanvases = { red: null, yellow: null, orange: null };

    for (let key in imageSources) {
      images[key] = new Image();
      images[key].src = imageSources[key];
      images[key].onload = () => {
        loadedImageCount++;
        if (key === 'leaf') {
          createColoredLeaves(images[key]);
        }
      };
    }

    function createColoredLeaves(leafImg) {
      const colors = { red: '#e74c3c', yellow: '#f1c40f', orange: '#e67e22' };
      const w = leafImg.naturalWidth || 100;
      const h = leafImg.naturalHeight || 100;

      for (let colorKey in colors) {
        const offCanvas = document.createElement('canvas');
        offCanvas.width = w;
        offCanvas.height = h;
        const offCtx = offCanvas.getContext('2d');
        offCtx.drawImage(leafImg, 0, 0, w, h);
        offCtx.globalCompositeOperation = 'source-in';
        offCtx.fillStyle = colors[colorKey];
        offCtx.fillRect(0, 0, w, h);
        coloredLeafCanvases[colorKey] = offCanvas;
      }
    }

    let score = 0;
    let totalScore = parseInt(localStorage.getItem('totalScore') || '0', 10);
    let unlockedRewards = JSON.parse(localStorage.getItem('unlockedRewards') || '[]');
    let pendingRewards = [];

    totalScoreEl.textContent = totalScore;

    let timeLeft = 30;
    let gameTimeout = null;
    let leafSpawnTimeout = null;
    let timerInterval = null;
    let isPlaying = false;

    const FPS = 45;
    const frameInterval = 1000 / FPS;
    let lastFrameTime = 0;

    let targetMousePos = { x: canvas.width / 2, y: 100 };
    let prevMousePos = { x: canvas.width / 2, y: 100 };
    let mouseSpeed = 0;
    let penaltyMessageTimer = 0;
    let ignorePenaltyFrames = 0;

    const hook = { x: canvas.width / 2, y: 100, size: 18, targetSize: 50, caughtItem: null };

    const itemTypes = [
      { name: 'さつまいも', imgKey: 'satsumaimo', score: 100, radius: 30, targetSize: 80, speed: 2.5, weight: 0.9 },
      { name: '柿', imgKey: 'kaki', score: 120, radius: 25, targetSize: 60, speed: 3.0, weight: 0.8 },
      { name: '秋刀魚', imgKey: 'sanma', score: 300, radius: 25, targetSize: 110, speed: 5.2, weight: 1.0 },
      { name: 'ブドウ', imgKey: 'budou', score: 200, radius: 28, targetSize: 75, speed: 3.5, weight: 0.9 },
      { name: '梨', imgKey: 'nashi', score: 150, radius: 26, targetSize: 65, speed: 3.2, weight: 0.8 },
      { name: 'カボチャ', imgKey: 'kabocha', score: 250, radius: 32, targetSize: 85, speed: 2.2, weight: 1.2 },
      { name: 'キノコ類', imgKey: 'kinoko', score: 80, radius: 22, targetSize: 55, speed: 4.2, weight: 0.6 },
      { name: 'りんご', imgKey: 'apple', score: 140, radius: 26, targetSize: 65, speed: 3.2, weight: 0.8 },
      { name: '栗', imgKey: 'marron', score: 90, radius: 22, targetSize: 55, speed: 3.8, weight: 0.6 },
      { name: '新米', imgKey: 'rice', score: 280, radius: 30, targetSize: 80, speed: 2.8, weight: 1.1 },
      { name: '鮭', imgKey: 'salmon', score: 320, radius: 27, targetSize: 105, speed: 4.8, weight: 1.1 },
      { name: 'レンコン', imgKey: 'lotus', score: 160, radius: 28, targetSize: 70, speed: 3.0, weight: 0.9 }
    ];

    let items = [];
    let fallingLeaves = [];

    function updateTargetPos(clientX, clientY, isFirstTouch = false) {
      const rect = canvas.getBoundingClientRect();
      const scaleX = canvas.width / rect.width;
      const scaleY = canvas.height / rect.height;

      const currentX = (clientX - rect.left) * scaleX;
      const currentY = (clientY - rect.top) * scaleY;

      if (isFirstTouch) {
        prevMousePos.x = currentX;
        prevMousePos.y = currentY;
        mouseSpeed = 0;
      } else {
        const dx = currentX - prevMousePos.x;
        const dy = currentY - prevMousePos.y;
        mouseSpeed = Math.sqrt(dx * dx + dy * dy);
      }

      targetMousePos.x = currentX;
      targetMousePos.y = currentY;
      prevMousePos.x = currentX;
      prevMousePos.y = currentY;
    }

    canvas.addEventListener('mousemove', (e) => {
      updateTargetPos(e.clientX, e.clientY);
    });

    canvas.addEventListener('touchstart', (e) => {
      updateTargetPos(e.touches[0].clientX, e.touches[0].clientY, true);
    }, { passive: false });

    canvas.addEventListener('touchmove', (e) => {
      updateTargetPos(e.touches[0].clientX, e.touches[0].clientY);
      e.preventDefault();
    }, { passive: false });

    function scheduleNextSpawn() {
      if (!isPlaying) return;

      let maxItems = 4;
      let speedMultiplier = 1.0;
      let spawnDelay = 1200;

      if (timeLeft <= 10) {
        maxItems = 7;
        speedMultiplier = 1.4;
        spawnDelay = 600;
      } else if (timeLeft <= 20) {
        maxItems = 6;
        speedMultiplier = 1.2;
        spawnDelay = 900;
      }

      if (items.length < maxItems) {
        const type = itemTypes[Math.floor(Math.random() * itemTypes.length)];
        const direction = Math.random() < 0.5 ? 1 : -1;
        const x = direction === 1 ? -60 : canvas.width + 60;
        const y = Math.random() * (canvas.height - 230) + 170;

        items.push({
          ...type,
          x: x,
          y: y,
          vx: type.speed * speedMultiplier * direction,
          direction: direction,
          isFalling: false,
          id: Math.random()
        });
      }

      gameTimeout = setTimeout(scheduleNextSpawn, spawnDelay);
    }

    function scheduleLeafSpawn() {
      if (!isPlaying) return;

      const rand = Math.random();
      let colorType = 'red';
      if (rand < 4 / 12) {
        colorType = 'yellow';
      } else if (rand < (4 + 3) / 12) {
        colorType = 'orange';
      }

      fallingLeaves.push({
        x: Math.random() * (canvas.width - 100) + 50,
        y: -40,
        size: 35 + Math.random() * 15,
        speedY: 1.2 + Math.random() * 1.0,
        swingSpeed: 0.03 + Math.random() * 0.02,
        swingWidth: 30 + Math.random() * 20,
        phase: Math.random() * Math.PI * 2,
        colorType: colorType,
        radius: 18
      });

      const nextDelay = 1200 + Math.random() * 1500;
      leafSpawnTimeout = setTimeout(scheduleLeafSpawn, nextDelay);
    }

    function startGame() {
      if (loadedImageCount < totalImages) {
        alert('画像の読み込み中です。少々お待ちください。');
        return;
      }

      score = 0;
      timeLeft = 30;
      items = [];
      fallingLeaves = [];
      hook.caughtItem = null;
      hook.x = canvas.width / 2;
      hook.y = 100;
      targetMousePos.x = canvas.width / 2;
      targetMousePos.y = 100;
      prevMousePos.x = canvas.width / 2;
      prevMousePos.y = 100;
      penaltyMessageTimer = 0;
      ignorePenaltyFrames = 68;
      isPlaying = true;
      lastFrameTime = performance.now();
      
      scoreEl.textContent = score;
      timeEl.textContent = timeLeft;
      startBtn.disabled = true;

      if (gameTimeout) clearTimeout(gameTimeout);
      if (leafSpawnTimeout) clearTimeout(leafSpawnTimeout);

      scheduleNextSpawn();
      scheduleLeafSpawn();

      if (timerInterval) clearInterval(timerInterval);
      timerInterval = setInterval(() => {
        timeLeft--;
        timeEl.textContent = timeLeft;
        if (timeLeft <= 0) {
          endGame();
        }
      }, 1000);

      requestAnimationFrame(gameLoop);
    }

    function checkRewardUnlocks() {
      rewardData.forEach(r => {
        if (totalScore >= r.req && !unlockedRewards.includes(r.id)) {
          unlockedRewards.push(r.id);
          pendingRewards.push(r);
        }
      });
      localStorage.setItem('unlockedRewards', JSON.stringify(unlockedRewards));
    }

    function endGame() {
      isPlaying = false;
      if (gameTimeout) clearTimeout(gameTimeout);
      if (leafSpawnTimeout) clearTimeout(leafSpawnTimeout);
      clearInterval(timerInterval);
      startBtn.disabled = false;

      totalScore += score;
      totalScoreEl.textContent = totalScore;
      localStorage.setItem('totalScore', totalScore.toString());

      checkRewardUnlocks();

      alert(`タイムアップ！ あなたのスコアは ${score} pt でした！\n通算スコア: ${totalScore} pt`);

      if (pendingRewards.length > 0) {
        showNextRewardModal();
      }
    }

    function showNextRewardModal() {
      if (pendingRewards.length === 0) return;
      const current = pendingRewards[0];
      rewardTitle.textContent = `${current.name} ゲット‼︎`;
      rewardImg.src = BASE_URL + current.file;
      rewardModal.classList.add('active');
      startParticleAnimation();
    }

    modalCloseBtn.addEventListener('click', () => {
      stopParticleAnimation();
      rewardModal.classList.remove('active');
      pendingRewards.shift();
      if (pendingRewards.length > 0) {
        setTimeout(showNextRewardModal, 300);
      }
    });

    let particleAnimId = null;
    const pCanvas = document.getElementById('particleCanvas');
    const pCtx = pCanvas.getContext('2d');
    let particles = [];

    function startParticleAnimation() {
      pCanvas.width = pCanvas.offsetWidth;
      pCanvas.height = pCanvas.offsetHeight;
      particles = [];

      for (let i = 0; i < 25; i++) {
        const rand = Math.random();
        let color = '#e74c3c';
        if (rand < 0.33) color = '#f1c40f';
        else if (rand < 0.66) color = '#e67e22';

        particles.push({
          x: Math.random() * pCanvas.width,
          y: Math.random() * pCanvas.height - pCanvas.height,
          size: 15 + Math.random() * 12,
          speedY: 1.5 + Math.random() * 2,
          speedX: Math.random() * 2 - 1,
          rot: Math.random() * Math.PI * 2,
          rotSpeed: Math.random() * 0.05 - 0.025,
          color: color
        });
      }

      function loop() {
        pCtx.clearRect(0, 0, pCanvas.width, pCanvas.height);
        particles.forEach(p => {
          p.y += p.speedY;
          p.x += p.speedX;
          p.rot += p.rotSpeed;

          if (p.y > pCanvas.height + 20) {
            p.y = -20;
            p.x = Math.random() * pCanvas.width;
          }

          pCtx.save();
          pCtx.translate(p.x, p.y);
          pCtx.rotate(p.rot);
          
          if (coloredLeafCanvases.red) {
            let type = 'red';
            if (p.color === '#f1c40f') type = 'yellow';
            if (p.color === '#e67e22') type = 'orange';
            pCtx.drawImage(coloredLeafCanvases[type], -p.size/2, -p.size/2, p.size, p.size);
          } else {
            pCtx.fillStyle = p.color;
            pCtx.beginPath();
            pCtx.arc(0, 0, p.size/2, 0, Math.PI * 2);
            pCtx.fill();
          }
          pCtx.restore();
        });
        particleAnimId = requestAnimationFrame(loop);
      }
      loop();
    }

    function stopParticleAnimation() {
      if (particleAnimId) cancelAnimationFrame(particleAnimId);
    }

    collectionBtn.addEventListener('click', () => {
      collectionGrid.innerHTML = '';
      rewardData.forEach(r => {
        const isUnlocked = unlockedRewards.includes(r.id);
        const itemEl = document.createElement('div');
        itemEl.className = `collection-item ${isUnlocked ? 'unlocked' : ''}`;
        
        const imgEl = document.createElement('img');
        imgEl.src = BASE_URL + r.file;
        
        const titleEl = document.createElement('div');
        titleEl.textContent = isUnlocked ? r.name : '???';

        const ptsEl = document.createElement('div');
        ptsEl.style.fontSize = '9px';
        ptsEl.style.color = '#7f8c8d';
        ptsEl.textContent = `${r.req}pt`;

        itemEl.appendChild(imgEl);
        itemEl.appendChild(titleEl);
        itemEl.appendChild(ptsEl);
        collectionGrid.appendChild(itemEl);
      });
      collectionModal.classList.add('active');
    });

    collectionCloseBtn.addEventListener('click', () => {
      collectionModal.classList.remove('active');
    });

    function gameLoop(timestamp) {
      if (!isPlaying) return;

      const elapsed = timestamp - lastFrameTime;

      if (elapsed >= frameInterval) {
        lastFrameTime = timestamp - (elapsed % frameInterval);
        update();
      }

      requestAnimationFrame(gameLoop);
    }

    function update() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);

      const dxMouse = targetMousePos.x - hook.x;
      const dyMouse = targetMousePos.y - hook.y;
      const distMouse = Math.sqrt(dxMouse * dxMouse + dyMouse * dyMouse);

      let followSpeed = 0.4;
      if (hook.caughtItem) {
        followSpeed = 0.28 / hook.caughtItem.weight;
      }

      hook.x += dxMouse * followSpeed;
      hook.y += dyMouse * followSpeed;

      if (ignorePenaltyFrames > 0) {
        ignorePenaltyFrames--;
        mouseSpeed = 0;
      } else if (isPlaying && mouseSpeed > 180) {
        score = Math.max(0, score - 30);
        scoreEl.textContent = score;
        penaltyMessageTimer = 22;
        mouseSpeed = 0;
      }

      if (hook.caughtItem && distMouse > 250) {
        dropCaughtItem();
      }

      ctx.beginPath();
      ctx.moveTo(canvas.width / 2, 0);
      ctx.lineTo(hook.x, hook.y);
      ctx.strokeStyle = '#555';
      ctx.lineWidth = 2;
      ctx.stroke();

      const armImg = images.arm;
      if (armImg && armImg.complete) {
        let drawW = hook.targetSize;
        let drawH = hook.targetSize;

        if (armImg.naturalWidth && armImg.naturalHeight) {
          const ratio = armImg.naturalWidth / armImg.naturalHeight;
          if (ratio >= 1) {
            drawH = hook.targetSize / ratio;
          } else {
            drawW = hook.targetSize * ratio;
          }
        }

        ctx.save();
        ctx.translate(hook.x, hook.y);
        ctx.drawImage(armImg, -drawW, -4, drawW, drawH);
        ctx.restore();
      }

      for (let i = fallingLeaves.length - 1; i >= 0; i--) {
        let leaf = fallingLeaves[i];

        leaf.y += leaf.speedY;
        leaf.phase += leaf.swingSpeed;

        const currentX = leaf.x + Math.sin(leaf.phase) * leaf.swingWidth;
        const angle = Math.cos(leaf.phase) * 0.5;
        const scaleX = Math.sin(leaf.phase * 1.5);

        if (leaf.y > canvas.height + 50) {
          fallingLeaves.splice(i, 1);
          continue;
        }

        const leafCanvas = coloredLeafCanvases[leaf.colorType] || images.leaf;
        if (leafCanvas) {
          ctx.save();
          ctx.translate(currentX, leaf.y);
          ctx.rotate(angle);
          ctx.scale(scaleX, 1);
          ctx.drawImage(leafCanvas, -leaf.size / 2, -leaf.size / 2, leaf.size, leaf.size);
          ctx.restore();
        }

        if (isPlaying) {
          let checkX = hook.x;
          let checkY = hook.y;
          let checkRadius = hook.size;

          if (hook.caughtItem) {
            checkX = hook.caughtItem.x;
            checkY = hook.caughtItem.y;
            checkRadius = hook.caughtItem.radius;
          }

          const distDX = currentX - checkX;
          const distDY = leaf.y - checkY;
          const distance = Math.sqrt(distDX * distDX + distDY * distDY);

          if (distance < leaf.radius + checkRadius) {
            if (hook.caughtItem) {
              dropCaughtItem();
            }
          }
        }
      }

      for (let i = items.length - 1; i >= 0; i--) {
        let item = items[i];
        const img = images[item.imgKey];

        let drawWidth = item.targetSize;
        let drawHeight = item.targetSize;

        if (img && img.naturalWidth && img.naturalHeight) {
          const aspectRatio = img.naturalWidth / img.naturalHeight;
          if (aspectRatio >= 1) {
            drawWidth = item.targetSize;
            drawHeight = item.targetSize / aspectRatio;
          } else {
            drawHeight = item.targetSize;
            drawWidth = item.targetSize * aspectRatio;
          }
        }

        if (item === hook.caughtItem) {
          item.x = hook.x - drawWidth / 4;
          item.y = hook.y + drawHeight / 2;

          if (hook.y < 50) {
            score += item.score;
            scoreEl.textContent = score;
            items.splice(i, 1);
            hook.caughtItem = null;
            continue;
          }
        } else if (item.isFalling) {
          item.vy += 0.4;
          item.y += item.vy;

          if (item.y > canvas.height + 60) {
            items.splice(i, 1);
            continue;
          }
        } else {
          item.x += item.vx;

          if (item.x < -70 || item.x > canvas.width + 70) {
            items.splice(i, 1);
            continue;
          }

          if (!hook.caughtItem && isPlaying) {
            const dx = hook.x - item.x;
            const dy = hook.y - item.y;
            const distance = Math.sqrt(dx * dx + dy * dy);

            if (distance < hook.size + item.radius) {
              hook.caughtItem = item;
            }
          }
        }

        if (img && img.complete) {
          ctx.save();
          ctx.translate(item.x, item.y);
          if (item.direction === 1) {
            ctx.scale(-1, 1);
          }
          ctx.drawImage(img, -drawWidth / 2, -drawHeight / 2, drawWidth, drawHeight);
          ctx.restore();
        }
      }

      if (penaltyMessageTimer > 0) {
        penaltyMessageTimer--;
        ctx.fillStyle = '#e74c3c';
        ctx.font = 'bold 24px sans-serif';
        ctx.textAlign = 'center';
        ctx.fillText('⚠️ 振り回しすぎ！ -30pt', canvas.width / 2, 70);
      }
    }

    function dropCaughtItem() {
      if (hook.caughtItem) {
        hook.caughtItem.isFalling = true;
        hook.caughtItem.vy = 2;
        hook.caughtItem = null;
      }
    }

    startBtn.addEventListener('click', startGame);
  </script>
</body>
</html>
