<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>秋の味覚 一本釣りゲーム</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      background-color: #fceabb;
      font-family: 'Helvetica Neue', Arial, sans-serif;
      text-align: center;
      user-select: none;
    }
    h1 {
      margin: 15px 0 5px;
      color: #8b4513;
    }
    #game-container {
      position: relative;
      width: 800px;
      margin: 0 auto;
    }
    canvas {
      background-color: #fff8dc;
      border: 4px solid #8b4513;
      border-radius: 12px;
      box-shadow: 0 8px 16px rgba(0, 0, 0, 0.2);
      cursor: crosshair;
    }
    .ui-panel {
      display: flex;
      justify-content: space-between;
      width: 800px;
      margin: 10px auto;
      font-size: 20px;
      font-weight: bold;
      color: #5c2c0c;
    }
    #start-btn {
      padding: 10px 25px;
      font-size: 18px;
      font-weight: bold;
      color: #fff;
      background-color: #e67e22;
      border: none;
      border-radius: 20px;
      cursor: pointer;
      box-shadow: 0 4px #d35400;
      transition: all 0.1s;
    }
    #start-btn:active {
      box-shadow: 0 0 #d35400;
      transform: translateY(4px);
    }
    #start-btn:disabled {
      background-color: #bdc3c7;
      box-shadow: none;
      cursor: not-allowed;
    }
  </style>
</head>
<body>

  <h1>🍂 秋の味覚 一本釣りゲーム 🎣</h1>
  
  <div class="ui-panel">
    <div>残り時間: <span id="time">30</span> 秒</div>
    <div>スコア: <span id="score">0</span> pt</div>
  </div>

  <div id="game-container">
    <canvas id="gameCanvas" width="800" height="500"></canvas>
  </div>

  <div style="margin-top: 15px;">
    <button id="start-btn">ゲームスタート！</button>
  </div>

  <script>
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');
    const scoreEl = document.getElementById('score');
    const timeEl = document.getElementById('time');
    const startBtn = document.getElementById('start-btn');

    const BASE_URL = 'https://fishing-me-yupe.github.io/oneshot-assets/';

    // 画像の事前ロード処理（計7種類）
    const imageSources = {
      kaki: BASE_URL + encodeURIComponent('柿.svg'),
      satsumaimo: BASE_URL + encodeURIComponent('さつまいも.svg'),
      sanma: BASE_URL + encodeURIComponent('秋刀魚.svg'),
      budou: BASE_URL + encodeURIComponent('ブドウ.svg'),
      nashi: BASE_URL + encodeURIComponent('梨.svg'),
      kabocha: BASE_URL + encodeURIComponent('カボチャ.svg'),
      kinoko: BASE_URL + encodeURIComponent('キノコ類.svg')
    };

    const images = {};
    let loadedImageCount = 0;
    const totalImages = Object.keys(imageSources).length;

    for (let key in imageSources) {
      images[key] = new Image();
      images[key].src = imageSources[key];
      images[key].onload = () => {
        loadedImageCount++;
      };
    }

    // ゲーム変数
    let score = 0;
    let timeLeft = 30;
    let gameInterval = null;
    let timerInterval = null;
    let isPlaying = false;

    // マウス/タッチの目標位置
    let targetMousePos = { x: canvas.width / 2, y: 100 };

    // 釣り針（プレイヤー）の位置
    const hook = {
      x: canvas.width / 2,
      y: 100,
      size: 15,
      caughtItem: null
    };

    // 秋の味覚アイテムデータ
    // weight: 重さ（重いほど引き上げ速度が低下し、振り回すと落ちやすい）
    const itemTypes = [
      { name: 'さつまいも', imgKey: 'satsumaimo', score: 100, radius: 30, targetSize: 80, speed: 2.0, weight: 1.2 },
      { name: '柿', imgKey: 'kaki', score: 120, radius: 25, targetSize: 60, speed: 2.5, weight: 1.0 },
      { name: '秋刀魚', imgKey: 'sanma', score: 300, radius: 25, targetSize: 110, speed: 4.5, weight: 1.5 },
      { name: 'ブドウ', imgKey: 'budou', score: 200, radius: 28, targetSize: 75, speed: 3.0, weight: 1.3 },
      { name: '梨', imgKey: 'nashi', score: 150, radius: 26, targetSize: 65, speed: 2.8, weight: 1.1 },
      { name: 'カボチャ', imgKey: 'kabocha', score: 250, radius: 32, targetSize: 85, speed: 1.8, weight: 2.0 },
      { name: 'キノコ類', imgKey: 'kinoko', score: 80, radius: 22, targetSize: 55, speed: 3.5, weight: 0.8 }
    ];

    let items = [];

    // マウス・タッチ座標の更新
    function updateTargetPos(clientX, clientY) {
      const rect = canvas.getBoundingClientRect();
      targetMousePos.x = clientX - rect.left;
      targetMousePos.y = clientY - rect.top;
    }

    canvas.addEventListener('mousemove', (e) => {
      updateTargetPos(e.clientX, e.clientY);
    });

    canvas.addEventListener('touchmove', (e) => {
      updateTargetPos(e.touches[0].clientX, e.touches[0].clientY);
      e.preventDefault();
    }, { passive: false });

    // アイテムのランダム生成
    function createItem() {
      const type = itemTypes[Math.floor(Math.random() * itemTypes.length)];
      const direction = Math.random() < 0.5 ? 1 : -1;
      const x = direction === 1 ? -60 : canvas.width + 60;
      const y = Math.random() * (canvas.height - 230) + 170;

      items.push({
        ...type,
        x: x,
        y: y,
        vx: type.speed * direction,
        direction: direction,
        isFalling: false, // 落ちている最中かどうか
        id: Math.random()
      });
    }

    // ゲーム開始
    function startGame() {
      if (loadedImageCount < totalImages) {
        alert('画像の読み込み中です。少々お待ちください。');
        return;
      }

      score = 0;
      timeLeft = 30;
      items = [];
      hook.caughtItem = null;
      hook.x = canvas.width / 2;
      hook.y = 100;
      targetMousePos.x = canvas.width / 2;
      targetMousePos.y = 100;
      isPlaying = true;
      
      scoreEl.textContent = score;
      timeEl.textContent = timeLeft;
      startBtn.disabled = true;

      if (gameInterval) clearInterval(gameInterval);
      gameInterval = setInterval(() => {
        if (items.length < 8) createItem();
      }, 900);

      if (timerInterval) clearInterval(timerInterval);
      timerInterval = setInterval(() => {
        timeLeft--;
        timeEl.textContent = timeLeft;
        if (timeLeft <= 0) {
          endGame();
        }
      }, 1000);

      requestAnimationFrame(update);
    }

    // ゲーム終了
    function endGame() {
      isPlaying = false;
      clearInterval(gameInterval);
      clearInterval(timerInterval);
      startBtn.disabled = false;
      alert(`タイムアップ！ あなたのスコアは ${score} pt でした！`);
    }

    // メイン更新・描画ループ
    function update() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);

      // --- 釣り針の移動制御（対策1: 重さと追従スピード制限） ---
      const dxMouse = targetMousePos.x - hook.x;
      const dyMouse = targetMousePos.y - hook.y;
      const distMouse = Math.sqrt(dxMouse * dxMouse + dyMouse * dyMouse);

      // 追従速度の係数（獲物を引っかけている時は重さに応じて遅くなる）
      let followSpeed = 0.25;
      if (hook.caughtItem) {
        followSpeed = 0.15 / hook.caughtItem.weight;
      }

      hook.x += dxMouse * followSpeed;
      hook.y += dyMouse * followSpeed;

      // --- 対策2: 激しい操作による落下判定 ---
      if (hook.caughtItem) {
        // マウスと針の離れ具合（引っ張る力）で判定
        if (distMouse > 160) {
          // 振り回しすぎると外れて落下する
          hook.caughtItem.isFalling = true;
          hook.caughtItem.vy = 2; // 落下速度初期値
          hook.caughtItem = null;
        }
      }

      // 1. 竿と糸の描画
      ctx.beginPath();
      ctx.moveTo(canvas.width / 2, 0);
      ctx.lineTo(hook.x, hook.y);
      ctx.strokeStyle = '#555';
      ctx.lineWidth = 2;
      ctx.stroke();

      // 2. 釣り針（フック）の描画
      ctx.beginPath();
      ctx.arc(hook.x, hook.y, hook.size, 0, Math.PI * 2);
      ctx.fillStyle = hook.caughtItem ? '#27ae60' : '#e74c3c';
      ctx.fill();
      ctx.lineWidth = 3;
      ctx.strokeStyle = '#fff';
      ctx.stroke();

      // 3. アイテムの更新と描画
      for (let i = items.length - 1; i >= 0; i--) {
        let item = items[i];
        const img = images[item.imgKey];

        // 画像アスペクト比の維持
        let drawWidth = item.targetSize;
        let drawHeight = item.targetSize;

        if (img && img.naturalWidth && img.naturalHeight) {
          const aspectRatio = img.naturalWidth / img.naturalHeight;
          if (aspectRatio >= 1) {
            drawWidth = item.targetSize;
            drawHeight = item.targetSize / aspectRatio;
          } else {
            drawHeight = item.targetSize;
            drawWidth = item.targetSize * aspectRatio;
          }
        }

        if (item === hook.caughtItem) {
          // 釣り上げ中：針の位置に追従
          item.x = hook.x;
          item.y = hook.y + drawHeight / 2;

          // 画面上部（ゴール）まで引き上げたらスコア獲得
          if (hook.y < 50) {
            score += item.score;
            scoreEl.textContent = score;
            items.splice(i, 1);
            hook.caughtItem = null;
            continue;
          }
        } else if (item.isFalling) {
          // 落下中
          item.vy += 0.4; // 重力加速度
          item.y += item.vy;

          // 画面下に落ち切ったら消去
          if (item.y > canvas.height + 100) {
            items.splice(i, 1);
            continue;
          }
        } else {
          // 通常移動
          item.x += item.vx;

          // 画面外に出たら削除
          if (item.x < -100 || item.x > canvas.width + 100) {
            items.splice(i, 1);
            continue;
          }

          // 当たり判定
          if (!hook.caughtItem && isPlaying) {
            const dx = hook.x - item.x;
            const dy = hook.y - item.y;
            const distance = Math.sqrt(dx * dx + dy * dy);

            if (distance < hook.size + item.radius) {
              hook.caughtItem = item;
            }
          }
        }

        // --- SVGイラストの描画 ---
        if (img && img.complete) {
          ctx.save();
          ctx.translate(item.x, item.y);
          
          if (item.direction === 1) {
            ctx.scale(-1, 1);
          }
          
          ctx.drawImage(img, -drawWidth / 2, -drawHeight / 2, drawWidth, drawHeight);
          ctx.restore();
        }
      }

      if (isPlaying) {
        requestAnimationFrame(update);
      }
    }

    startBtn.addEventListener('click', startGame);
  </script>
</body>
</html>
