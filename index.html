<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>秋の味覚 一本釣りゲーム</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      background-color: #fceabb;
      font-family: 'Helvetica Neue', Arial, sans-serif;
      text-align: center;
      user-select: none;
    }
    h1 {
      margin: 15px 0 5px;
      color: #8b4513;
    }
    #game-container {
      position: relative;
      width: 800px;
      margin: 0 auto;
    }
    canvas {
      background-color: #fff8dc;
      border: 4px solid #8b4513;
      border-radius: 12px;
      box-shadow: 0 8px 16px rgba(0, 0, 0, 0.2);
      cursor: crosshair;
    }
    .ui-panel {
      display: flex;
      justify-content: space-between;
      width: 800px;
      margin: 10px auto;
      font-size: 20px;
      font-weight: bold;
      color: #5c2c0c;
    }
    #start-btn {
      padding: 10px 25px;
      font-size: 18px;
      font-weight: bold;
      color: #fff;
      background-color: #e67e22;
      border: none;
      border-radius: 20px;
      cursor: pointer;
      box-shadow: 0 4px #d35400;
      transition: all 0.1s;
    }
    #start-btn:active {
      box-shadow: 0 0 #d35400;
      transform: translateY(4px);
    }
  </style>
</head>
<body>

  <h1>🍂 秋の味覚 一本釣りゲーム 🎣</h1>
  
  <div class="ui-panel">
    <div>残り時間: <span id="time">30</span> 秒</div>
    <div>スコア: <span id="score">0</span> pt</div>
  </div>

  <div id="game-container">
    <canvas id="gameCanvas" width="800" height="500"></canvas>
  </div>

  <div style="margin-top: 15px;">
    <button id="start-btn">ゲームスタート！</button>
  </div>

  <script>
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');
    const scoreEl = document.getElementById('score');
    const timeEl = document.getElementById('time');
    const startBtn = document.getElementById('start-btn');

    // SVG画像の読み込み設定
    const images = {};
    const imageSources = {
      kaki: '柿.svg',
      satsumaimo: 'さつまいも.svg'
    };

    let loadedImagesCount = 0;
    const totalImages = Object.keys(imageSources).length;

    for (let key in imageSources) {
      images[key] = new Image();
      images[key].src = imageSources[key];
      images[key].onload = () => {
        loadedImagesCount++;
      };
    }

    // ゲーム変数
    let score = 0;
    let timeLeft = 30;
    let gameInterval = null;
    let timerInterval = null;
    let isPlaying = false;

    // 釣り針（プレイヤー）の位置
    const hook = {
      x: canvas.width / 2,
      y: 100,
      size: 15,
      caughtItem: null
    };

    // 出現させるアイテム（柿・さつまいもの2種類に絞り込み）
    const itemTypes = [
      { typeKey: 'satsumaimo', name: 'さつまいも', score: 100, radius: 30, speed: 2, displayWidth: 60, displayHeight: 60 },
      { typeKey: 'kaki', name: '柿', score: 150, radius: 25, speed: 3.5, displayWidth: 50, displayHeight: 50 }
    ];

    let items = [];

    // マウス操作
    canvas.addEventListener('mousemove', (e) => {
      const rect = canvas.getBoundingClientRect();
      hook.x = e.clientX - rect.left;
      hook.y = e.clientY - rect.top;
    });

    // タッチ操作対応
    canvas.addEventListener('touchmove', (e) => {
      const rect = canvas.getBoundingClientRect();
      hook.x = e.touches[0].clientX - rect.left;
      hook.y = e.touches[0].clientY - rect.top;
      e.preventDefault();
    }, { passive: false });

    // アイテム生成
    function createItem() {
      const type = itemTypes[Math.floor(Math.random() * itemTypes.length)];
      const direction = Math.random() < 0.5 ? 1 : -1;
      const x = direction === 1 ? -40 : canvas.width + 40;
      const y = Math.random() * (canvas.height - 200) + 150;

      items.push({
        ...type,
        x: x,
        y: y,
        vx: type.speed * direction,
        id: Math.random()
      });
    }

    // ゲーム開始
    function startGame() {
      score = 0;
      timeLeft = 30;
      items = [];
      hook.caughtItem = null;
      isPlaying = true;
      
      scoreEl.textContent = score;
      timeEl.textContent = timeLeft;
      startBtn.disabled = true;

      if (gameInterval) clearInterval(gameInterval);
      gameInterval = setInterval(() => {
        if (items.length < 6) createItem();
      }, 900);

      if (timerInterval) clearInterval(timerInterval);
      timerInterval = setInterval(() => {
        timeLeft--;
        timeEl.textContent = timeLeft;
        if (timeLeft <= 0) {
          endGame();
        }
      }, 1000);

      requestAnimationFrame(update);
    }

    // ゲーム終了
    function endGame() {
      isPlaying = false;
      clearInterval(gameInterval);
      clearInterval(timerInterval);
      startBtn.disabled = false;
      alert(`タイムアップ！ あなたのスコアは ${score} pt でした！`);
    }

    // メイン更新・描画ループ
    function update() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);

      // 1. 竿と糸の描画
      ctx.beginPath();
      ctx.moveTo(canvas.width / 2, 0);
      ctx.lineTo(hook.x, hook.y);
      ctx.strokeStyle = '#555';
      ctx.lineWidth = 2;
      ctx.stroke();

      // 2. 釣り針（フック）の描画
      ctx.beginPath();
      ctx.arc(hook.x, hook.y, hook.size, 0, Math.PI * 2);
      ctx.fillStyle = hook.caughtItem ? '#27ae60' : '#e74c3c';
      ctx.fill();
      ctx.lineWidth = 3;
      ctx.strokeStyle = '#fff';
      ctx.stroke();

      // 3. アイテムの更新と描画
      for (let i = items.length - 1; i >= 0; i--) {
        let item = items[i];

        if (item === hook.caughtItem) {
          // 釣り上げ中
          item.x = hook.x;
          item.y = hook.y + 30;

          if (hook.y < 50) {
            score += item.score;
            scoreEl.textContent = score;
            items.splice(i, 1);
            hook.caughtItem = null;
            continue;
          }
        } else {
          // 通常移動
          item.x += item.vx;

          if (item.x < -60 || item.x > canvas.width + 60) {
            items.splice(i, 1);
            continue;
          }

          // 当たり判定
          if (!hook.caughtItem && isPlaying) {
            const dx = hook.x - item.x;
            const dy = hook.y - item.y;
            const distance = Math.sqrt(dx * dx + dy * dy);

            if (distance < hook.size + item.radius) {
              hook.caughtItem = item;
            }
          }
        }

        // SVG画像の描画
        const img = images[item.typeKey];
        if (img && img.complete && img.naturalWidth !== 0) {
          ctx.drawImage(
            img, 
            item.x - item.displayWidth / 2, 
            item.y - item.displayHeight / 2, 
            item.displayWidth, 
            item.displayHeight
          );
        } else {
          // フォールバック（万が一画像読み込み前の表示）
          ctx.beginPath();
          ctx.arc(item.x, item.y, item.radius, 0, Math.PI * 2);
          ctx.fillStyle = item.typeKey === 'satsumaimo' ? '#8b0000' : '#ff7f50';
          ctx.fill();
        }
      }

      if (isPlaying) {
        requestAnimationFrame(update);
      }
    }

    startBtn.addEventListener('click', startGame);
  </script>
</body>
</html>
