<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>秋の味覚 一本釣りゲーム</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      background-color: #fceabb;
      font-family: 'Helvetica Neue', Arial, sans-serif;
      text-align: center;
      user-select: none;
    }
    h1 {
      margin: 15px 0 5px;
      color: #8b4513;
    }
    #game-container {
      position: relative;
      width: 800px;
      margin: 0 auto;
    }
    canvas {
      background-color: #fff8dc;
      border: 4px solid #8b4513;
      border-radius: 12px;
      box-shadow: 0 8px 16px rgba(0, 0, 0, 0.2);
      cursor: crosshair;
    }
    .ui-panel {
      display: flex;
      justify-content: space-between;
      width: 800px;
      margin: 10px auto;
      font-size: 20px;
      font-weight: bold;
      color: #5c2c0c;
    }
    #start-btn {
      padding: 10px 25px;
      font-size: 18px;
      font-weight: bold;
      color: #fff;
      background-color: #e67e22;
      border: none;
      border-radius: 20px;
      cursor: pointer;
      box-shadow: 0 4px #d35400;
      transition: all 0.1s;
    }
    #start-btn:active {
      box-shadow: 0 0 #d35400;
      transform: translateY(4px);
    }
    #start-btn:disabled {
      background-color: #bdc3c7;
      box-shadow: none;
      cursor: not-allowed;
    }
  </style>
</head>
<body>

  <h1>🍂 秋の味覚 一本釣りゲーム 🎣</h1>
  
  <div class="ui-panel">
    <div>残り時間: <span id="time">30</span> 秒</div>
    <div>スコア: <span id="score">0</span> pt</div>
  </div>

  <div id="game-container">
    <canvas id="gameCanvas" width="800" height="500"></canvas>
  </div>

  <div style="margin-top: 15px;">
    <button id="start-btn">ゲームスタート！</button>
  </div>

  <script>
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');
    const scoreEl = document.getElementById('score');
    const timeEl = document.getElementById('time');
    const startBtn = document.getElementById('start-btn');

    const BASE_URL = 'https://fishing-me-yupe.github.io/oneshot-assets/';

    // 画像のロード（新しく3つ追加して計10種類）
    const imageSources = {
      kaki: BASE_URL + 'persimmon.svg',
      satsumaimo: BASE_URL + 'sweetpotato.svg',
      sanma: BASE_URL + 'pacific-saury.svg',
      budou: BASE_URL + 'grapes.svg',
      nashi: BASE_URL + 'pears.svg',
      kabocha: BASE_URL + 'pumpkin.svg',
      kinoko: BASE_URL + 'mushrooms.svg',
      apple: BASE_URL + 'apple.svg',
      marron: BASE_URL + 'marron.svg',
      rice: BASE_URL + 'rice.svg'
    };

    const images = {};
    let loadedImageCount = 0;
    const totalImages = Object.keys(imageSources).length;

    for (let key in imageSources) {
      images[key] = new Image();
      images[key].src = imageSources[key];
      images[key].onload = () => {
        loadedImageCount++;
      };
    }

    // ゲーム変数
    let score = 0;
    let timeLeft = 30;
    let gameInterval = null;
    let timerInterval = null;
    let isPlaying = false;

    // マウス位置と速度計測用
    let targetMousePos = { x: canvas.width / 2, y: 100 };
    let prevMousePos = { x: canvas.width / 2, y: 100 };
    let mouseSpeed = 0;
    let penaltyMessageTimer = 0;

    // 釣り針（プレイヤー）の位置
    const hook = {
      x: canvas.width / 2,
      y: 100,
      size: 15,
      caughtItem: null
    };

    // 秋の味覚アイテムデータ（10種類）
    const itemTypes = [
      { name: 'さつまいも', imgKey: 'satsumaimo', score: 100, radius: 30, targetSize: 80, speed: 2.0, weight: 1.1 },
      { name: '柿', imgKey: 'kaki', score: 120, radius: 25, targetSize: 60, speed: 2.5, weight: 0.9 },
      { name: '秋刀魚', imgKey: 'sanma', score: 300, radius: 25, targetSize: 110, speed: 4.5, weight: 1.3 },
      { name: 'ブドウ', imgKey: 'budou', score: 200, radius: 28, targetSize: 75, speed: 3.0, weight: 1.1 },
      { name: '梨', imgKey: 'nashi', score: 150, radius: 26, targetSize: 65, speed: 2.8, weight: 1.0 },
      { name: 'カボチャ', imgKey: 'kabocha', score: 250, radius: 32, targetSize: 85, speed: 1.8, weight: 1.5 },
      { name: 'キノコ類', imgKey: 'kinoko', score: 80, radius: 22, targetSize: 55, speed: 3.5, weight: 0.7 },
      { name: 'りんご', imgKey: 'apple', score: 140, radius: 26, targetSize: 65, speed: 2.7, weight: 1.0 },
      { name: '栗', imgKey: 'marron', score: 90, radius: 22, targetSize: 55, speed: 3.2, weight: 0.8 },
      { name: '新米', imgKey: 'rice', score: 280, radius: 30, targetSize: 80, speed: 2.2, weight: 1.4 }
    ];

    let items = [];

    // マウス・タッチ座標の更新
    function updateTargetPos(clientX, clientY) {
      const rect = canvas.getBoundingClientRect();
      const currentX = clientX - rect.left;
      const currentY = clientY - rect.top;

      const dx = currentX - prevMousePos.x;
      const dy = currentY - prevMousePos.y;
      mouseSpeed = Math.sqrt(dx * dx + dy * dy);

      targetMousePos.x = currentX;
      targetMousePos.y = currentY;
      prevMousePos.x = currentX;
      prevMousePos.y = currentY;
    }

    canvas.addEventListener('mousemove', (e) => {
      updateTargetPos(e.clientX, e.clientY);
    });

    canvas.addEventListener('touchmove', (e) => {
      updateTargetPos(e.touches[0].clientX, e.touches[0].clientY);
      e.preventDefault();
    }, { passive: false });

    // アイテムのランダム生成
    function createItem() {
      const type = itemTypes[Math.floor(Math.random() * itemTypes.length)];
      const direction = Math.random() < 0.5 ? 1 : -1;
      const x = direction === 1 ? -60 : canvas.width + 60;
      const y = Math.random() * (canvas.height - 230) + 170;

      items.push({
        ...type,
        x: x,
        y: y,
        vx: type.speed * direction,
        direction: direction,
        isFalling: false,
        id: Math.random()
      });
    }

    // ゲーム開始
    function startGame() {
      if (loadedImageCount < totalImages) {
        alert('画像の読み込み中です。少々お待ちください。');
        return;
      }

      score = 0;
      timeLeft = 30;
      items = [];
      hook.caughtItem = null;
      hook.x = canvas.width / 2;
      hook.y = 100;
      targetMousePos.x = canvas.width / 2;
      targetMousePos.y = 100;
      prevMousePos.x = canvas.width / 2;
      prevMousePos.y = 100;
      penaltyMessageTimer = 0;
      isPlaying = true;
      
      scoreEl.textContent = score;
      timeEl.textContent = timeLeft;
      startBtn.disabled = true;

      if (gameInterval) clearInterval(gameInterval);
      gameInterval = setInterval(() => {
        if (items.length < 9) createItem();
      }, 800);

      if (timerInterval) clearInterval(timerInterval);
      timerInterval = setInterval(() => {
        timeLeft--;
        timeEl.textContent = timeLeft;
        if (timeLeft <= 0) {
          endGame();
        }
      }, 1000);

      requestAnimationFrame(update);
    }

    // ゲーム終了
    function endGame() {
      isPlaying = false;
      clearInterval(gameInterval);
      clearInterval(timerInterval);
      startBtn.disabled = false;
      alert(`タイムアップ！ あなたのスコアは ${score} pt でした！`);
    }

    // メイン更新・描画ループ
    function update() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);

      // --- 釣り針の移動制御 ---
      const dxMouse = targetMousePos.x - hook.x;
      const dyMouse = targetMousePos.y - hook.y;
      const distMouse = Math.sqrt(dxMouse * dxMouse + dyMouse * dyMouse);

      let followSpeed = 0.3;
      if (hook.caughtItem) {
        followSpeed = 0.2 / hook.caughtItem.weight;
      }

      hook.x += dxMouse * followSpeed;
      hook.y += dyMouse * followSpeed;

      // --- 減点判定: マウスを暴れさせすぎたら減点 ---
      if (isPlaying && mouseSpeed > 130) {
        score = Math.max(0, score - 30);
        scoreEl.textContent = score;
        penaltyMessageTimer = 30;
        mouseSpeed = 0;
      }

      // --- 落下判定: 強引に引っ張りすぎたら落下 ---
      if (hook.caughtItem) {
        if (distMouse > 240) {
          hook.caughtItem.isFalling = true;
          hook.caughtItem.vy = 2;
          hook.caughtItem = null;
        }
      }

      // 1. 竿と糸の描画
      ctx.beginPath();
      ctx.moveTo(canvas.width / 2, 0);
      ctx.lineTo(hook.x, hook.y);
      ctx.strokeStyle = '#555';
      ctx.lineWidth = 2;
      ctx.stroke();

      // 2. 釣り針（フック）の描画
      ctx.beginPath();
      ctx.arc(hook.x, hook.y, hook.size, 0, Math.PI * 2);
      ctx.fillStyle = hook.caughtItem ? '#27ae60' : '#e74c3c';
      ctx.fill();
      ctx.lineWidth = 3;
      ctx.strokeStyle = '#fff';
      ctx.stroke();

      // 3. アイテムの更新と描画
      for (let i = items.length - 1; i >= 0; i--) {
        let item = items[i];
        const img = images[item.imgKey];

        let drawWidth = item.targetSize;
        let drawHeight = item.targetSize;

        if (img && img.naturalWidth && img.naturalHeight) {
          const aspectRatio = img.naturalWidth / img.naturalHeight;
          if (aspectRatio >= 1) {
            drawWidth = item.targetSize;
            drawHeight = item.targetSize / aspectRatio;
          } else {
            drawHeight = item.targetSize;
            drawWidth = item.targetSize * aspectRatio;
          }
        }

        if (item === hook.caughtItem) {
          item.x = hook.x;
          item.y = hook.y + drawHeight / 2;

          if (hook.y < 50) {
            score += item.score;
            scoreEl.textContent = score;
            items.splice(i, 1);
            hook.caughtItem = null;
            continue;
          }
        } else if (item.isFalling) {
          item.vy += 0.4;
          item.y += item.vy;

          if (item.y > canvas.height + 100) {
            items.splice(i, 1);
            continue;
          }
        } else {
          item.x += item.vx;

          if (item.x < -100 || item.x > canvas.width + 100) {
            items.splice(i, 1);
            continue;
          }

          if (!hook.caughtItem && isPlaying) {
            const dx = hook.x - item.x;
            const dy = hook.y - item.y;
            const distance = Math.sqrt(dx * dx + dy * dy);

            if (distance < hook.size + item.radius) {
              hook.caughtItem = item;
            }
          }
        }

        // SVGイラスト描画
        if (img && img.complete) {
          ctx.save();
          ctx.translate(item.x, item.y);
          
          if (item.direction === 1) {
            ctx.scale(-1, 1);
          }
          
          ctx.drawImage(img, -drawWidth / 2, -drawHeight / 2, drawWidth, drawHeight);
          ctx.restore();
        }
      }

      // 警告テキストの描画
      if (penaltyMessageTimer > 0) {
        penaltyMessageTimer--;
        ctx.fillStyle = '#e74c3c';
        ctx.font = 'bold 24px sans-serif';
        ctx.textAlign = 'center';
        ctx.fillText('⚠️ 振り回しすぎ！ -30pt', canvas.width / 2, 70);
      }

      if (isPlaying) {
        requestAnimationFrame(update);
      }
    }

    startBtn.addEventListener('click', startGame);
  </script>
</body>
</html>
